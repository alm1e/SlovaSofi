<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профіль викладача | SlovaSofi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="auth-page">
    <main class="auth-wrapper">
        <section class="auth-card">
            <div class="lang-switcher d-flex gap-1 justify-content-end mb-3" role="group" aria-label="Language">
                <button type="button" class="btn-lang-item" data-lang="ua">UA</button>
                <button type="button" class="btn-lang-item" data-lang="ru">RU</button>
                <button type="button" class="btn-lang-item" data-lang="en">EN</button>
            </div>
            <h1 class="auth-title" data-i18n="title">Завершіть налаштування профілю викладача</h1>
            <p class="auth-subtitle" data-i18n="subtitle">Вас запросили до SlovaSofi. Заповніть профіль і створіть пароль для входу.</p>
            <form id="teacherSetupForm" hidden>
                <div class="mb-3">
                    <label class="form-label" for="firstName" data-i18n="firstName">Ім’я</label>
                    <input class="form-control" id="firstName" name="firstName" autocomplete="given-name" maxlength="80" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="lastName" data-i18n="lastName">Прізвище</label>
                    <input class="form-control" id="lastName" name="lastName" autocomplete="family-name" maxlength="80" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="teacherEmail" data-i18n="email">Електронна пошта</label>
                    <input class="form-control" id="teacherEmail" type="email" autocomplete="email" readonly>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="phone" data-i18n="phone">Номер телефону (необов’язково)</label>
                    <input class="form-control" id="phone" name="phone" type="tel" autocomplete="tel" maxlength="32">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password" data-i18n="password">Створіть пароль (не менше 8 символів)</label>
                    <input class="form-control" id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="confirmPassword" data-i18n="confirmPassword">Повторіть пароль</label>
                    <input class="form-control" id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
                </div>
                <button class="btn btn-card-green-cta w-100 mt-2" type="submit" data-i18n="submit">Зберегти профіль і створити пароль</button>
            </form>
            <div id="setupMessage" class="mt-3" role="status" aria-live="polite"></div>
            <p class="auth-note">
                <a href="login.html" data-i18n="login">Перейти до входу</a>
            </p>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase-config.js"></script>
    <script src="assets/js/teacher-setup.js"></script>
</body>
</html>
