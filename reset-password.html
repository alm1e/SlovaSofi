<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Зміна пароля | SlovaSofi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="auth-page">
    <main class="auth-wrapper">
        <section class="auth-card">
            <a class="navbar-brand d-flex align-items-center logo-wrap justify-content-center mb-4" href="index.html">
                <span class="logo-s">S</span>
                <span class="logo-text-stack">
                    <span class="logo-lova">lova</span>
                    <span class="logo-sofi">OFI</span>
                    <span class="logo-sub">LANGUAGE SCHOOL</span>
                </span>
            </a>
            <h1 class="auth-title" id="resetTitle">Створіть новий пароль</h1>
            <p class="auth-subtitle" id="resetDescription">Введіть новий пароль для свого облікового запису.</p>
            <form id="resetPasswordForm" hidden>
                <div class="mb-3">
                    <label class="form-label" for="newPassword" id="passwordLabel">Новий пароль</label>
                    <input class="form-control" id="newPassword" type="password" minlength="8"
                           autocomplete="new-password" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="confirmPassword" id="confirmLabel">Повторіть пароль</label>
                    <input class="form-control" id="confirmPassword" type="password" minlength="8"
                           autocomplete="new-password" required>
                </div>
                <button class="btn btn-card-green-cta w-100 mt-2" id="savePasswordButton" type="submit">
                    Зберегти пароль
                </button>
            </form>
            <div id="resetMessage" class="mb-3" role="status" aria-live="polite"></div>
            <div id="resetLinkActions" hidden>
                <a class="btn btn-card-green-cta w-100" href="login.html" id="loginLink">Повернутися до входу</a>
            </div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase-config.js"></script>
    <script src="assets/js/reset-password.js"></script>
</body>
</html>
