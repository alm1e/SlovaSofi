<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Заметки и пропуски — SlovaSofi</title>
<link rel="stylesheet" href="../assets/css/lesson-notes.css">
<style>body{margin:0;padding:32px 20px;background:#f5f7f6;color:#25342e;font:16px/1.6 system-ui}main{max-width:850px;margin:auto}button{font:inherit;border:1px solid #8da99b;padding:8px 16px;border-radius:10px;background:transparent;color:inherit;cursor:pointer}header{display:flex;justify-content:space-between;gap:12px;align-items:center}.task{padding:24px;border:1px solid #d8e0dc;border-radius:16px;background:#fff;margin:24px 0}h2{font-size:20px}input{width:110px;font:inherit;color:inherit;background:transparent;border:1px solid #a0b5ab;padding:6px 10px}html[data-theme=dark] body{background:#101a1f;color:#e7eeeb}html[data-theme=dark] .task{background:#182329;border-color:#34474a}.activity-rich-text ol{padding-left:26px}</style>
<script src="../assets/js/locales.js"></script><script src="../assets/js/lesson-notes.js"></script><script src="../assets/js/activity-ui.js"></script><script src="../assets/js/fill-blanks.js"></script></head>
<body><main><header><strong>SlovaSofi · пример оформления</strong><button id="theme">Светлая / тёмная тема</button></header><div id="note"></div><section class="task"><h2>1.2 Rozprávanie so zmenami</h2><div id="exercise" class="lesson-fill-text"></div><button>Проверить ответы</button></section><p>Заметку можно свернуть нажатием на заголовок.</p></main><script>
document.getElementById('theme').onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';};
document.getElementById('note').innerHTML=SlovaActivityUI.renderNote('1. Strom — дерево\n2. Mrakodrap — небоскрёб\n3. Slimák — улитка','Слова к заданию',{note:true,noteColor:'#e4ae16'});
const content='1. Predtým sme mali **nemoderné** auto, ale teraz máme [moderné] auto.\n2. Predtým sme bývali v **malom** byte, ale teraz bývame vo [veľkom] byte.\n3. Včera bol deň [škaredý], pršalo a bolo chladno, ale dnes je deň **pekný**.\n4. Náš starý dom bol **úzky a nízky**, teraz máme dom [široký] a [vysoký].';
const parsed=SlovaFillBlanks.parse(content);document.getElementById('exercise').innerHTML=SlovaActivityUI.renderBlankText(parsed.parts,parsed.answers.map((_,i)=>'<input aria-label="Ответ '+(i+1)+'">'));
</script></body></html>
