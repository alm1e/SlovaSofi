<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Картинки с пропусками — SlovaSofi</title><link rel="stylesheet" href="../assets/css/blank-cards.css"><script src="../assets/js/blank-cards.js"></script><style>body{margin:0;padding:28px 18px;background:#f4f7f5;color:#293b32;font:16px/1.5 system-ui}main{max-width:850px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:12px}.task{background:#fff;border:1px solid #d7e0da;padding:24px;border-radius:16px;margin-top:24px}h2{font-size:20px;margin:0 0 20px}button{font:inherit;cursor:pointer}header button,#check{border:1px solid #288866;border-radius:9px;background:transparent;color:inherit;padding:8px 14px}input{font:inherit;background:transparent;color:inherit;border:1px solid #bdcfc2;border-radius:8px;padding:7px}#check{background:#288866;color:white;margin-top:24px}.blank-correct{border-color:#1d9a6a!important}.blank-incorrect{border-color:#b96868!important}html[data-theme=dark] body{background:#111b20;color:#e6eeea}html[data-theme=dark] .task{background:#18262a;border-color:#374a42}</style></head><body><main><header><strong>SlovaSofi · картинки с пропусками</strong><button id="theme">Светлая / тёмная тема</button></header><section class="task"><h2>Priraď krajiny k vlajkám</h2><div id="example"></div><button id="check">Проверить ответы</button><p id="result" role="status"></p></section></main><script>
const data=[['Nemecko',['#151515','#dc2834','#ffc742'],'h'],['Francúzsko',['#12489e','#fff','#e13448'],'v'],['Poľsko',['#fff','#d92446'],'h'],['Taliansko',['#07945b','#fff','#df3548'],'v'],['Ukrajina',['#1769c9','#ffd54d'],'h'],['Japonsko',['#fff'],'j']];
function flag(colors,kind){const n=colors.length,rects=colors.map((color,i)=>kind==='v'?`<rect x="${i*180/n}" width="${180/n}" height="120" fill="${color}"/>`:`<rect y="${i*120/n}" width="180" height="${120/n}" fill="${color}"/>`).join('');return 'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="180" height="120">${rects}${kind==='j'?'<circle cx="90" cy="60" r="32" fill="#bc1938"/>':''}</svg>`);}
const html='<div class="activity-rich-text">'+data.map(([,colors,kind],index)=>`<p><img src="${flag(colors,kind)}" alt="Флаг ${index+1}"><input data-blank-answer aria-label="Ответ ${index+1}"></p>`).join('')+'</div>';
document.getElementById('example').innerHTML=SlovaBlankCards.render(html,[...data.map(row=>row[0]),'Čína','Kanada'],'cards','ru');SlovaBlankCards.bind(document);
document.getElementById('theme').onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';};
document.getElementById('check').onclick=()=>{let count=0;document.querySelectorAll('[data-blank-answer]').forEach((input,index)=>{const correct=input.value.trim().toLocaleLowerCase()===data[index][0].toLocaleLowerCase();input.classList.toggle('blank-correct',correct);input.classList.toggle('blank-incorrect',!correct);if(correct)count++;});document.getElementById('result').textContent=`Правильно: ${count} из ${data.length}`;};
</script></body></html>
