<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Соединить пары — SlovaSofi</title><link rel="stylesheet" href="../assets/css/matching.css"><link rel="stylesheet" href="../assets/css/sorting.css">
<style>body{margin:0;padding:28px 18px;background:#f4f7f5;color:#263b30;font:16px/1.6 system-ui}main{max-width:880px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:12px}.task{padding:24px;border:1px solid #d7e2da;border-radius:16px;background:#fff;margin-top:24px}h2{font-size:20px;margin:0 0 20px}header button,#check{font:inherit;cursor:pointer;border:1px solid #258b69;border-radius:10px;background:transparent;color:inherit;padding:8px 14px}#check{margin-top:24px;background:#258b69;color:#fff}html[data-theme=dark] body{background:#111b20;color:#e7efea}html[data-theme=dark] .task{background:#19272b;border-color:#374a43}</style><script src="../assets/js/activity-ui.js"></script></head><body><main><header><strong>SlovaSofi · соединить пары</strong><button id="theme">Светлая / тёмная тема</button></header><section class="task"><h2>1.2 Spoj krajinu s jej obyvateľom</h2><div id="board" data-pair-board></div><button id="check">Проверить</button><p id="result" role="status"></p></section></main><script>
const pairs=[['Taliansko','Talian'],['Slovensko','Slovák'],['Poľsko','Poliak'],['Maďarsko','Maďar'],['Nemecko','Nemec'],['Francúzsko','Francúz'],['Anglicko','Angličan'],['Španielsko','Španiel']];
document.getElementById('board').innerHTML=pairs.map(([country])=>`<div data-pair-row><span>${country}</span><select><option value=""></option>${pairs.map(([,person])=>`<option>${person}</option>`).join('')}</select></div>`).join('');
SlovaActivityUI.enhancePairing(document);
document.getElementById('theme').onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';};
document.getElementById('check').onclick=()=>{let count=0;[...document.querySelectorAll('[data-pair-row]')].forEach((row,index)=>{const correct=row.querySelector('select').value===pairs[index][1];row.dataset.pairResult=String(correct);if(correct)count++;});document.getElementById('board').dispatchEvent(new Event('pair-refresh'));document.getElementById('result').textContent=`Правильно: ${count} из ${pairs.length}`;};
</script></body></html>
