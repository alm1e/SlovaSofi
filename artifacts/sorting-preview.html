<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Распределить слова — SlovaSofi</title><link rel="stylesheet" href="../assets/css/sorting.css">
<style>body{background:#f4f7f5;color:#263a31;font:16px/1.6 system-ui;padding:24px 16px;margin:0}main{max-width:900px;margin:auto}.task{background:#fff;border:1px solid #d8e1dc;border-radius:16px;padding:24px;margin-top:24px}header{display:flex;align-items:center;justify-content:space-between;gap:16px}button{font:inherit}header button,#check{border:1px solid #158665;border-radius:10px;padding:9px 16px;background:transparent;color:inherit;cursor:pointer}#check{margin-top:24px;background:#158665;color:white}h2{font-size:20px;margin:0 0 20px}html[data-theme=dark] body{background:#111b20;color:#e6eeea}html[data-theme=dark] .task{background:#1a252a;border-color:#35474a}</style>
<script src="../assets/js/activity-ui.js"></script></head><body><main><header><strong>SlovaSofi · распределение слов</strong><button id="theme">Светлая / тёмная тема</button></header><section class="task"><h2>Распределите слова: фрукты и овощи</h2><div data-pair-board data-pair-reuse id="board"></div><button id="check">Проверить ответы</button><p id="result" role="status"></p></section></main><script>
const items=[['Яблоко','Фрукты'],['Морковь','Овощи'],['Банан','Фрукты'],['Огурец','Овощи'],['Груша','Фрукты'],['Помидор','Овощи']];
document.getElementById('board').innerHTML=items.map(([word])=>`<div data-pair-row><span>${word}</span><select aria-label="${word}"><option value="">Выберите</option><option>Фрукты</option><option>Овощи</option></select></div>`).join('');
SlovaActivityUI.enhancePairing(document);
document.getElementById('theme').onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';};
document.getElementById('check').onclick=()=>{const values=[...document.querySelectorAll('select')].map(s=>s.value);const correct=values.filter((value,index)=>value===items[index][1]).length;document.getElementById('result').textContent=`Правильно: ${correct} из ${items.length}`;};
</script></body></html>
