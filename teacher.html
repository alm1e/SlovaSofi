<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f8f5">
    <title>Кабинет преподавателя | SlovaSofi</title>
    <script>
        (() => {
            let savedTheme = null;
            try {
                savedTheme = localStorage.getItem("slovasofiTeacherTheme");
            } catch (error) {
                console.error("Could not read the teacher theme preference.", error);
            }
            const hour = new Date().getHours();
            const theme = savedTheme === "light" || savedTheme === "dark"
                ? savedTheme
                : hour < 7 || hour >= 18 ? "dark" : "light";
            if (theme === "dark") {
                document.documentElement.dataset.theme = "dark";
                document.querySelector('meta[name="theme-color"]').content = "#111a16";
            }
        })();
    </script>
    <link rel="stylesheet" href="assets/css/teacher.css">
    <link rel="stylesheet" href="assets/css/image-gallery.css">
