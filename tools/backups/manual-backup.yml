name: SlovaSofi manual download

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slovasofi-production-backup
  cancel-in-progress: false

jobs:
  backup:
    if: github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout backup tools
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Checkout website source for recovery
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: alm1e/SlovaSofi
          ref: main
          path: site-source
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 2.121.0

      - name: Install verified restic release
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/restic_0.19.1_linux_amd64.bz2"
          curl --fail --location --silent --show-error --retry 3 \
            'https://github.com/restic/restic/releases/download/v0.19.1/restic_0.19.1_linux_amd64.bz2' \
            --output "$archive"
          printf '%s  %s\n' 'f415415624dcc452f2a02b8c33641791a8c6d6d3b65bbb3543fcf9a25151585c' "$archive" | sha256sum --check -
          bunzip2 --stdout "$archive" > "$RUNNER_TEMP/restic"
          chmod 700 "$RUNNER_TEMP/restic"
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Test export and encrypted archive restoration
        env:
          BACKUP_RESTIC_BINARY: restic
        run: node --test tools/backups/*.test.cjs

      - name: Create and verify encrypted download
        id: export
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
          BACKUP_SOURCE_DIR: ${{ github.workspace }}/site-source
          BACKUP_MANUAL_OUTPUT: ${{ runner.temp }}/slovasofi-manual
          BACKUP_MAX_STORAGE_BYTES: ${{ vars.BACKUP_MAX_STORAGE_BYTES || '134217728' }}
          BACKUP_MAX_REPOSITORY_BYTES: ${{ vars.BACKUP_MAX_REPOSITORY_BYTES || '8589934592' }}
        run: node tools/backups/manual.cjs

      # Only the verified, encrypted archive and its checksum leave the runner.
      - name: Offer encrypted archive for download
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SlovaSofi-manual-backup
          path: |
            ${{ steps.export.outputs.archive }}
            ${{ steps.export.outputs.checksum }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Report failure
        if: failure()
        run: echo '::error::Manual backup failed. No verified download is available. Do not rely on this run as a backup.'
