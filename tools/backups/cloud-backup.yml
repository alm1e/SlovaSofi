# Install this workflow in a PRIVATE SlovaSofi-backups repository using prepare.cjs.
name: SlovaSofi cloud backup

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      initialize:
        description: 'Create the encrypted repository (first run only)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: slovasofi-production-backup
  cancel-in-progress: false

jobs:
  backup:
    # A private repository avoids public-repository schedule suspension after inactivity.
    if: github.event.repository.private && (vars.BACKUPS_ENABLED == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout backup tools
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Checkout website source for recovery
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: alm1e/SlovaSofi
          ref: main
          path: site-source
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1, pinned
        with:
          version: 2.121.0

      - name: Install verified restic release
        shell: bash
        run: |
          set -euo pipefail
          restic_archive="$RUNNER_TEMP/restic_0.19.1_linux_amd64.bz2"
          curl --fail --location --silent --show-error --retry 3 \
            'https://github.com/restic/restic/releases/download/v0.19.1/restic_0.19.1_linux_amd64.bz2' \
            --output "$restic_archive"
          printf '%s  %s\n' 'f415415624dcc452f2a02b8c33641791a8c6d6d3b65bbb3543fcf9a25151585c' "$restic_archive" | sha256sum --check -
          bunzip2 --stdout "$restic_archive" > "$RUNNER_TEMP/restic"
          chmod 700 "$RUNNER_TEMP/restic"
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Test backup tools and encrypted restore
        env:
          BACKUP_RESTIC_BINARY: restic
        run: node --test tools/backups/*.test.cjs

      - name: Back up database, accounts and Storage
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESTIC_REPOSITORY: ${{ secrets.RESTIC_REPOSITORY }}
          RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          BACKUP_PROJECT_REF: vvrxhiextryjnzpxvals
          BACKUP_R2_ACCOUNT_ID: dd1c9cccc478514ab9ff2d921d99e885
          BACKUP_INITIALIZE: ${{ github.event_name == 'workflow_dispatch' && inputs.initialize == true }}
          BACKUP_RETENTION_ENABLED: ${{ vars.BACKUP_RETENTION_ENABLED == 'true' }}
          BACKUP_MAX_STORAGE_BYTES: ${{ vars.BACKUP_MAX_STORAGE_BYTES || '134217728' }}
          BACKUP_MAX_REPOSITORY_BYTES: ${{ vars.BACKUP_MAX_REPOSITORY_BYTES || '8589934592' }}
          BACKUP_STAGE_PARENT: ${{ runner.temp }}/slovasofi-backups
          BACKUP_SOURCE_DIR: ${{ github.workspace }}/site-source
        run: node tools/backups/backup.cjs

      - name: Report failure
        if: failure()
        run: echo '::error::Backup did not complete. Previous snapshots are retained. Check the last successful backup before relying on recovery.'

      # Never upload plaintext SQL, manifests or downloaded files as GitHub artifacts.
      # The hosted runner and its temporary staging files are discarded after the job.
