<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реєстрація | SlovaSofi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="auth-page">
    <main class="auth-wrapper">
        <section class="auth-card">
            <div class="lang-switcher d-flex gap-1 justify-content-end mb-3">
                <button type="button" class="btn-lang-item active" data-lang="ua">UA</button>
                <button type="button" class="btn-lang-item" data-lang="ru">RU</button>
                <button type="button" class="btn-lang-item" data-lang="en">EN</button>
            </div>

            <h1 class="auth-title" data-key="title">Створити акаунт учня</h1>
            <p class="auth-subtitle" data-key="subtitle">Заповніть дані для реєстрації.</p>

            <form id="registerForm">
                <div class="mb-3">
                    <label class="form-label" for="firstName" data-key="first">Ім’я</label>
                    <input class="form-control" id="firstName" name="firstName" autocomplete="given-name" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="lastName" data-key="last">Прізвище</label>
                    <input class="form-control" id="lastName" name="lastName" autocomplete="family-name" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="email" data-key="email">Електронна пошта</label>
                    <input class="form-control" type="email" id="email" name="email" autocomplete="email" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="phone" data-key="phone">Телефон</label>
                    <input class="form-control" type="tel" id="phone" name="phone" autocomplete="tel">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password" data-key="password">Пароль</label>
                    <input class="form-control" type="password" id="password" name="password"
                           autocomplete="new-password" minlength="8" required>
                </div>
                <button class="btn btn-card-green-cta w-100 mt-2" type="submit" data-key="submit">
                    Зареєструватися
                </button>
            </form>

            <div id="authMessage" class="mt-3" role="status"></div>

            <p class="auth-note">
                <span data-key="haveAccount">Вже маєте акаунт?</span>
                <a href="login.html" data-key="login">Увійти</a>
            </p>
        </section>
    </main>

    <script>
        const translations = {
            ua: {
                title: "Створити акаунт учня", subtitle: "Заповніть дані для реєстрації.",
                first: "Ім’я", last: "Прізвище", email: "Електронна пошта",
                phone: "Телефон", password: "Пароль", submit: "Зареєструватися",
                haveAccount: "Вже маєте акаунт?", login: "Увійти"
            },
            ru: {
                title: "Создать аккаунт ученика", subtitle: "Заполните данные для регистрации.",
                first: "Имя", last: "Фамилия", email: "Электронная почта",
                phone: "Телефон", password: "Пароль", submit: "Зарегистрироваться",
                haveAccount: "Уже есть аккаунт?", login: "Войти"
            },
            en: {
                title: "Create a student account", subtitle: "Enter your details to register.",
                first: "First name", last: "Last name", email: "Email address",
                phone: "Phone", password: "Password", submit: "Register",
                haveAccount: "Already have an account?", login: "Sign in"
            }
        };

        function setLanguage(lang) {
            if (!translations[lang]) lang = "ua";
            document.querySelectorAll("[data-key]").forEach((element) => {
                element.textContent = translations[lang][element.dataset.key];
            });
            document.querySelectorAll("[data-lang]").forEach((button) => {
                button.classList.toggle("active", button.dataset.lang === lang);
            });
            localStorage.setItem("siteLanguage", lang);
        }

        document.querySelectorAll("[data-lang]").forEach((button) => {
            button.addEventListener("click", () => setLanguage(button.dataset.lang));
        });

        setLanguage(localStorage.getItem("siteLanguage") || "ua");
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase-config.js"></script>
    <script src="assets/js/auth.js"></script>
</body>
</html>
