<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f8f5">
    <title>Вхід до кабінету | SlovaSofi</title>
    <script src="assets/js/theme.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="auth-page">
    <main class="auth-wrapper">
        <section class="auth-card">
            <a class="navbar-brand d-flex align-items-center logo-wrap justify-content-center mb-4" href="index.html">
                <span class="logo-s">S</span>
                <span class="logo-text-stack">
                    <span class="logo-lova">lova</span>
                    <span class="logo-sofi">OFI</span>
                    <span class="logo-sub">LANGUAGE SCHOOL</span>
                </span>
            </a>

            <div class="auth-controls mb-3">
                <div class="lang-switcher d-flex gap-1">
                    <button type="button" class="btn-lang-item" data-lang="ua">UA</button>
                    <button type="button" class="btn-lang-item" data-lang="ru">RU</button>
                    <button type="button" class="btn-lang-item" data-lang="en">EN</button>
                </div>
                <button class="theme-toggle auth-theme-toggle" type="button" data-theme-toggle aria-label="Включить тему" aria-pressed="false">
                    <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 15.2A8.5 8.5 0 0 1 8.8 3.8 8.5 8.5 0 1 0 20.2 15.2Z"/></svg>
                    <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2"/></svg>
                </button>
            </div>

            <h1 class="auth-title" data-key="login_title">Вхід до кабінету</h1>
            <p class="auth-subtitle" data-key="login_subtitle">
                Увійдіть, щоб переглянути свої курси та уроки.
            </p>

            <form id="loginForm">
                <div class="mb-3">
                    <label for="email" class="form-label" data-key="email_label">Електронна пошта</label>
                    <input type="email" class="form-control" id="email" name="email"
                           placeholder="Введіть електронну пошту" autocomplete="email" required>
                </div>

                <div class="mb-3 auth-password-field">
                    <div class="auth-password-heading">
                        <label for="password" class="form-label" data-key="password_label">Пароль</label>
                        <button type="button" class="auth-forgot-password" id="forgotPasswordButton" data-key="forgot_password">
                            Забули пароль?
                        </button>
                    </div>
                    <input type="password" class="form-control" id="password" name="password"
                           placeholder="Введіть пароль" autocomplete="current-password" required>
                </div>

                <div id="authMessage" class="mb-3" role="status" aria-live="polite"></div>

                <button type="submit" class="btn btn-card-green-cta w-100 mt-2" data-key="login_button">
                    Увійти
                </button>
            </form>

            <p class="auth-note mb-0">
                <span data-key="register_prompt">Ще не маєте акаунта?</span>
                <a href="register.html" data-key="register_link">Зареєструватися</a>
            </p>

            <a href="index.html" class="auth-back-link" data-key="back_home">
                Повернутися на головну
            </a>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase-config.js"></script>

    <script>
        const loginTranslations = {
            ua: {
                login_title: "Вхід до кабінету",
                login_subtitle: "Увійдіть, щоб переглянути свої курси та уроки.",
                email_label: "Електронна пошта",
                password_label: "Пароль",
                login_button: "Увійти",
                back_home: "Повернутися на головну",
                register_prompt: "Ще не маєте акаунта?",
                register_link: "Зареєструватися",
                email_placeholder: "Введіть електронну пошту",
                password_placeholder: "Введіть пароль",
                forgot_password: "Забули пароль?"
            },
            ru: {
                login_title: "Вход в личный кабинет",
                login_subtitle: "Войдите, чтобы посмотреть свои курсы и уроки.",
                email_label: "Электронная почта",
                password_label: "Пароль",
                login_button: "Войти",
                back_home: "Вернуться на главную",
                register_prompt: "Ещё нет аккаунта?",
                register_link: "Зарегистрироваться",
                email_placeholder: "Введите электронную почту",
                password_placeholder: "Введите пароль",
                forgot_password: "Забыли пароль?"
            },
            en: {
                login_title: "Sign in",
                login_subtitle: "Sign in to view your courses and lessons.",
                email_label: "Email address",
                password_label: "Password",
                login_button: "Sign in",
                back_home: "Back to home",
                register_prompt: "Don't have an account?",
                register_link: "Register",
                email_placeholder: "Enter your email",
                password_placeholder: "Enter your password",
                forgot_password: "Forgot password?"
            }
        };

        function setLoginLanguage(lang) {
            const translations = loginTranslations[lang];
            if (!translations) return;

            document.querySelectorAll("[data-key]").forEach((element) => {
                element.textContent = translations[element.dataset.key] || "";
            });

            document.getElementById("email").placeholder = translations.email_placeholder;
            document.getElementById("password").placeholder = translations.password_placeholder;

            document.querySelectorAll(".btn-lang-item[data-lang]").forEach((button) => {
                button.classList.toggle("active", button.dataset.lang === lang);
            });

            localStorage.setItem("siteLanguage", lang);
        }

        document.querySelectorAll(".btn-lang-item[data-lang]").forEach((button) => {
            button.addEventListener("click", () => setLoginLanguage(button.dataset.lang));
        });

        setLoginLanguage(localStorage.getItem("siteLanguage") || "ua");
    </script>

    <script src="assets/js/auth.js"></script>
</body>
</html>
